<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rosette in Tesserae</title>
<meta name="description" content="An Islamic mosaic rosette laid tile by tile in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -10 20 20'%3E%3Ccircle r='10' fill='%231a3473'/%3E%3Cg fill='%23d3a64e'%3E%3Crect x='-5.5' y='-5.5' width='11' height='11'/%3E%3Crect x='-5.5' y='-5.5' width='11' height='11' transform='rotate(45)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="c" aria-label="A mosaic rosette being laid tile by tile"></canvas>
<div class="hud">
  <div class="top">
    <div class="pill">
      <div class="name">Rosette in Tesserae</div>
      <div class="sub">Eight-fold, laid from the center point</div>
    </div>
  </div>
  <div class="bottom">
    <div class="pill count">
      <div class="stage" id="stage">Preparing the bed</div>
      <div class="num"><span id="n">0</span><small id="of">of 0 tesserae</small></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="pill">
      <div class="ctrls">
        <button id="replay" type="button">Replay</button>
        <button id="speed" type="button">Speed 1×</button>
        <button id="finish" type="button">Finish</button>
        <button id="sweep" type="button">Sweep light</button>
        <button id="sound" type="button" aria-pressed="false">Sound off</button>
      </div>
      <div class="hint">Drag to turn · scroll to zoom · double-click to reset view</div>
    </div>
  </div>
</div>
<div id="err" hidden>This piece needs WebGL, which this browser has turned off.</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
